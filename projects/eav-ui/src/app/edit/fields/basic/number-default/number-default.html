<mat-form-field [formGroup]="group" color="accent" class="eav-mat-form-field">
  <input matInput type="number"
    class="eav-translate-on-dblclick"
    [formControlName]="config.fieldName"
    [required]="basics().required"
    [placeholder]="basics().placeholder"
    [min]="min()"
    [max]="max()">
  <mat-label>{{ basics().label }}</mat-label>
</mat-form-field>
<app-field-helper-text></app-field-helper-text>

@if (typeIfNotWhatsExpected() != null) {
  <div style="color: red;">
    Error: Input <code>{{ typeIfNotWhatsExpected() }}</code> for <code>{{ basics().label }}</code> not found.
    It's probably an extension input field, but it's not loaded.
    Showing default, please fix extension or change field configuration.
  </div>
}
